name: Kanban Progress Automation

on:
  issues:
    types: [opened, reopened, closed]
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

jobs:
  sync-kanban:
    name: sync-project-1
    if: >-
      github.event_name == 'issues' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check project token availability
        id: auth
        env:
          GH_PROJECT_PAT: ${{ secrets.GH_PROJECT_PAT }}
        run: |
          if [ -z "$GH_PROJECT_PAT" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping automated sync: GH_PROJECT_PAT secret is not configured. Enable built-in Project #1 workflows or add GH_PROJECT_PAT with 'project' scope."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.auth.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.auth.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc

      - name: Sync Kanban status on Project #1
        if: steps.auth.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_PAT }}
        run: |
          if [ ! -f scripts/kanban.mjs ]; then
            echo "scripts/kanban.mjs not yet present on base branch; skipping."
            exit 0
          fi
          node scripts/kanban.mjs sync-event
