name: Bug Report
description: Report broken behavior, regressions, or failing flows with deterministic reproduction steps.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction Steps
      description: Exact steps to reproduce locally or in Staging/Production.
      value: |
        1. Go to ...
        2. Click / send request to ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs Actual Behavior
      description: What should happen vs what actually happens?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - apps/web
        - apps/api
        - packages/shared
        - Infra / CI / Security
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocker (breaks demo / login / build)
        - High (core P0 flow degraded)
        - Medium (workaround exists)
        - Low (polish / minor UI)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, Stack Traces, or Screenshots
      description: Paste relevant console/API errors (redact cookies, tokens, and secrets) or attach screenshots.
    validations:
      required: false
